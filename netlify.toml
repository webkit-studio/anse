# Netlify konfigurace — build SPA + funkce
# API routy definují funkce samy přes `export const config = { path: "/api/*" }`,
# proto tu žádný /api redirect není. SPA fallback je neforcovaný — uplatní se,
# jen když nic jiného (soubor, funkce) nematchne.

[build]
  # Migrace a seed běží při každém deployi (idempotentní): úprava JSON definice
  # → push → deploy = nová verze definice v DB, bez ručních kroků.
  command = "npm run build && npm run migrate && npm run seed"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
