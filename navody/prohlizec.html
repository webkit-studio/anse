eré byl kupující předem upozorněn (zvláště pak závady vzniklé z důvodu atypického provedení). odchylky v typu a množství zboží způsobené chybnou objednávkou. odlišné odstíny lamel, profilů a jiných komponentů u zakázek (obj. zboží), které jsou vyráběny na dvě nebo více částí (nebo ve dvou či více termínech). vizuální vady se posuzují kolmo k povrchu ze vzdálenosti 1 m, za běžného světla. špatné dovírání lamel vlivem nečistot v zámcích lamel. špatně zvolený motor nebo příslušenství, které není určeno pro daný druh výrobku. otisky závěsů pancíře nepředstavují vadu výrobku. odlišné odstíny kresby a barevnosti u imitací dřeva. při venkovních teplotách pod 0 °c je důležité nevytahovat roletu až nahoru, ale nechat ji z boxu částečně vysunutou a to cca 10 cm, jinak může dojít k zajetí koncové lamely do boxu a poškození rolety. chybné funkce vlivem teplotních výkyvů, způsobené fyzikálními jevy, které výrobce nemůže ovlivnit. kondenzace vlhkosti na pásce, šňůře nebo klice za chladného počasí. v případě reklamace motoru je nutné vrátit motor s přívodním kabelem v délce min. 10 cm. rolety neslouží k úplnému zatemnění, tato skutečnost není předmětem reklamace (vodícími lištami, v prosvětlovacích otvorech u lamel a v oblasti schránky může prostupovat světlo). integrovaná síť proti hmyzu není 100% ochranou proti vniknutí hmyzu. prohnutí plastové koncovky vl vlivem váhy pancíře, pokud není koncovka podepřená v celé své šířce. lamely v horní části pancíře na sebe nemusí zcela dosedat, tato skutečnost není považována za závadu výrobku. odstín barvy hliníkových komponentů se může mírně lišit podle technologie výroby komponentu garážové rolety (válcovaný, extrudovaný, odlitek). uvedené číslo ral vyjadřuje nejbližší odstín barvy, nejedná se přímo o barevné tóny dle ral (neplatí pro rolety objednané v barvě ral). poškození rolety vzniklé silou větru a to i v případě použití větrného čidla."}, {"k": "Garážové rolety", "p": "Komponenty k výrobě garážových rolet PA52", "sl": "komponenty-k- s01.png", "t": "oprávněné reklamace jack west poškozené (poškrábané, odřené) zboží. rozměry rolet mimo toleranci oproti zadanému výrobnímu rozměru."}, {"k": "Garážové rolety", "p": "Komponenty k výrobě garážových rolet PA77", "sl": "komponenty-k-vyrobe-garazovych-rolet-pa77", "d": "Reklamační podmínky - garážové rolety (pdf)", "df": "reklamace-garazove-rolety.pdf", "n": "Neoprávněné reklamace", "h1": "Neoprávněné reklamace", "h2": null, "kr": null, "v": null, "i": "komponenty-k-vyrobe-garazovych-rolet-pa77/reklamace-garazove-rolety__s02.png", "t": "neoprávněné reklamace závady zboží způsobené jiným používáním výrobku, než ke kterému je výrobek určen. závady způsobené mechanickým poškozením ze strany uživatele (včetně poškození vzniklých umístěním  překážky pod lamely, poškození vlivem námrazy na lamelách apod.). závady způsobené chybnou montáží nebo obsluhou, popř. montáží do nevhodného prostředí. závady způsobené překročením mezních rozměrů jednotlivých výrobků dle čsn en 13659+a1 (mezní rozměry  jednotlivých typů výrobků - max. šířka, výška, plocha, hmotnost). závady, na které byl kupující předem upozorněn (zvláště pak závady vzniklé z důvodu atypického provedení). odchylky v typu a množství zboží způsobené chybnou objednávkou. odlišné odstíny lamel, profilů a jiných komponentů u zakázek (obj. zboží), které jsou vyráběny na dvě nebo více částí (nebo ve dvou či více termínech). vizuální vady se posuzují kolmo k povrchu ze vzdálenosti 1 m, za běžného světla. špatné dovírání lamel vlivem nečistot v zámcích lamel. špatně zvolený motor nebo příslušenství, které není určeno pro daný druh výrobku. otisky závěsů pancíře nepředstavují vadu výrobku. odlišné odstíny kresby a barevnosti u imitací dřeva. při venkovních teplotách pod 0 °c je důležité nevytahovat roletu až nahoru, ale nechat ji z boxu částečně vysunutou a to cca 10 cm, jinak může dojít k zajetí koncové lamely do boxu a poškození rolety. chybné funkce vlivem teplotních výkyvů, způsobené fyzikálními jevy, které výrobce nemůže ovlivnit. kondenzace vlhkosti na pásce, šňůře nebo klice za chladného počasí. v případě reklamace motoru je nutné vrátit motor s přívodním kabelem v délce min. 10 cm. rolety neslouží k úplnému zatemnění, tato skutečnost není předmětem reklamace (vodícími lištami, v prosvětlovacích otvorech u lamel a v oblasti schránky může prostupovat světlo). integrovaná síť proti hmyzu není 100% ochranou proti vniknutí hmyzu. prohnutí plastové koncovky vl vlivem váhy pancíře, pokud není koncovka podepřená v celé své šířce. lamely v horní části pancíře na sebe nemusí zcela dosedat, tato skutečnost není považována za závadu výrobku. odstín barvy hliníkových komponentů se může mírně lišit podle technologie výroby komponentu garážové rolety (válcovaný, extrudovaný, odlitek). uvedené číslo ral vyjadřuje nejbližší odstín barvy, nejedná se přímo o barevné tóny dle ral (neplatí pro rolety objednané v barvě ral). poškození rolety vzniklé silou větru a to i v případě použití větrného čidla."}, {"k": "Garážové rolety", "p": "Komponenty k výrobě garážových rolet PA77", "sl": "komponenty-k-vyrobe-garazovych-rolet-pa77", "d": "Lamela PA77 - max. šířka a výška (pdf)", "df": "lamela-pa-77-max-vyska-sirka.pdf", "n": "Lamela PA77 – maximální šířka rolety (mm)", "h1": null, "h2": "Lamela PA77 – maximální šířka rolety (mm)", "kr": null, "v": null, "i": "komponenty-k-vyrobe-garazovych-rolet-pa77/lamela-pa-77-max-vyska-sirka__s01.png", "t": "lamela pa77 – maximální šířka rolety (mm) třídění odolnosti a zatížení větrem pp89 pp110 <4700 <5000 <4000 <4600 <3500 <3800 <3100 <3300"}, {"k": "Garážové rolety", "p": "Komponenty k výrobě garážových rolet PA77", "sl": "komponenty-k-vyrobe-garazovych-rolet-pa77", "d": "Lamela PA77 - max. šířka a výška (pdf)", "df": "lamela-pa-77-max-vyska-sirka.pdf", "n": "Lamela PA77 – maximální výška rolety včetně boxu (mm)", "h1": null, "h2": "Lamela PA77 – maximální výška rolety včetně boxu (mm)", "kr": null, "v": null, "i": "komponenty-k-vyrobe-garazovych-rolet- ní clonou typu blackout. použití termínu „spontánní“ by znamenalo – ani více, ani méně – že sklo prasklo bez důvodu, ale není tomu tak. lepší termín je „samotné rozbití“ – rozbití z důvodů, které nejsou vždy zřejmé v době nákupu okna nebo jeho výroby. stává se, že na vrstveném skle se kvůli nesprávné dopravě nebo montáži a chybám při výrobě vytvoří mikrotrhliny, které nejsou pouhým okem viditelné. odborníci tomu říkají spontánní rozbití skla. takové situace jsou extrémně vzácné, přesto je výrobci oken, skleněných tabulí a okenních clon znají. k efektu samovolného rozbití vrstveného skla navíc může občas dojít i po instalaci stínítka typu blackout na okno. „jev samovolného rozbití skla je také způsoben inkluzí sulfidu nikelnatého při výrobě skla, který se – vlivem značného množství tepla – začne roztahovat. vzhledem k tomu, že sklo je vystaveno extrémně vysokým a nízkým teplotám, částice niklu se nemohou vrátit do své původní podoby, což způsobuje další pnutí uvnitř skla. kromě toho existuje vysoké riziko překročení přípustných hodnot napětí, které"}, {"k": "Plissé", "p": "Plissé Klasik D/N", "sl": "plisse-klasik", "d": "Doporučení pro BO látky (pdf)", "df": "doporuceni-pro-bo-latky.pdf", "n": "vede k samovolnému rozbití skleněné tabule.'*", "h1": "Drazí zákazníci", "h2": "vede k samovolnému rozbití skleněné tabule.'*", "kr": null, "v": null, "i": "plisse-klasik/doporuceni-pro-bo-latky__s03.png", "t": "vede k samovolnému rozbití skleněné tabule.'* bohužel si nad tím výrobci skel a oken myjí ruce a neberou to jako záruku nebo záruční opravu. abyste splnili vaše očekávání a předešli případným problémům, které byste mohli mít s výrobci oken, navrhujeme, aby mezi sklem a okenní clonou byl zachován dostatečný prostor a cirkulace. v takovém případě lze použít některý z našich přípravků: j, m, c, d."}, {"k": "Plissé", "p": "Plissé Klasik D/N", "sl": "plisse-klasik", "d": "Doporučení pro BO látky (pdf)", "df": "doporuceni-pro-bo-latky.pdf", "n": "vede k samovolnému rozbití s h2": "Komponenty", "kr": null, "v": null, "i": "do-prekladu-heluz/komponenty__s01.png", "t": "komponenty lamela pa 39 – aretovaný pancíř, koncová lamela revizní klapka vnitřní 55 mm, bílá, včetně kartáčku revizní klapka vnitřní 110 mm, bílá, včetně kartáčku revizní klapka vnější, bílá, včetně kartáčku pouzdro vodící lišty vodící lišta do pouzdra včetně kartáčku držáky do překladů heluz včetně nýtovacích matic a spojovacích materiálů hřídel 40 mm hřídel 60 mm plastová koncovka s trnem včetně ložiska pružinový závěs (siral k lamele pa39) pružinový závěs (manuální ovládání wm130 k lamele pa39) pružinový závěs (wma170 k lamele pa52)"}, {"k": "Venkovní rolety", "p": "Roleta do překladu HELUZ", "sl": "do-prekladu-heluz", "d": "Reklamační podmínky - venkovní rolety (pdf)", "df": "reklamace-venkovni-rolety.pdf", "n": "Oprávněné reklamace", "h1": "Oprávněné reklamace", "h2": null, "kr": null, "v": null, "i": "do-prekladu-heluz/reklamace-venkovni-rolety__s01.png", "t": "oprávněné reklamace jack west poškozené (poškrábané, odřené) zboží. rozměry rolet mimo toleranci oproti zadanému výrobnímu rozměru."}, {"k": "Venkovní rolety", "p": "Roleta do překladu HELUZ", "sl": "do-prekladu-heluz", "d": "Reklamační podmínky - venkovní rolety (pdf)", "df": "reklamace-venkovni-rolety.pdf", "n": "Neoprávněné reklamace", "h1": "Neoprávněné reklamace", "h2": null, "kr": null, "v": null, "i": "do-prekladu-heluz/reklamace-venkovni-rolety__s02.png", "t": "neoprávněné reklamace závady zboží způsobené jiným používáním výrobku, než ke kterému je výrobek určen. závady způsobené mechanickým poškozením ze strany uživatele (včetně poškození vzniklých umístěním  překážky pod lamely, poškození vlivem námrazy na lamelách apod.). závady způsobené chybnou montáží nebo obsluhou, popř. montáží do nevhodného prostředí. závady způsobené překročením mezních rozměrů jednotlivých výrobků dle čsn en 13659+a1 (mezní rozměry  jednotlivých typů výrobků - max. šířka, výška, plocha, hmotnost). závady, na které byl kupující předem upozorněn (zvláště pak závady vzniklé z důvodu atypického provedení). odchylky v typu a množství zboží způsobené chybnou objednávkou. odlišné odstíny lamel, profilů a jiných komponentů u zakázek (obj. zboží), které jsou vyráběny na dvě nebo více částí (nebo ve dvou či více termínech). vizuální vady se posuzují kolmo k povrchu ze vzdálenosti 1 m, za běžného světla. špatné dovírání lamel vlivem nečistot v zámcích lamel. špatně zvolený motor nebo příslušenství, které není určeno pro daný druh výrobku. otisky závěsů pancíře nepředstavují vadu výrobku. odlišné odstíny kresby a barevnosti u imitací dřeva. při venkovních teplotách pod 0 °c je důležité nevytahovat roletu až nahoru, ale nechat ji z boxu částečně vysunutou a to cca 10 cm, jinak může dojít k zajetí koncové lamely do boxu a poškození rolety. chybné funkce vlivem teplotních výkyvů, způsobené fyzikálními jevy, které výrobce nemůže ovlivnit. kondenzace vlhkosti na pásce, šňůře nebo klice za chladného počasí. venkovní rolety v případě reklamace motoru je nutné vrátit motor s přívodním kabelem v délce min. 10 cm. rolety neslouží k úplnému zatemnění, tato skutečnost není předmětem reklamace (vodícími lištami, v prosvětlovacích otvorech u lamel a v oblasti schránky může prostupovat světlo). integrovaná síť proti hmyzu není 100% ochranou proti vniknutí hmyzu. prohnutí plastové koncovky vl vlivem váhy pancíře, pokud není koncovka podepřená v celé své šířce. lamely v horní části pancíře na sebe nemusí zcela dosedat, tato skutečnost není považována za závadu výrobku. odstín barvy hliníkových komponentů se může mírně lišit podle technologie výroby komponentu (válcovaný, extrudovaný, odlitek). uvedené číslo ral vyjadřuje nejbližší odstín barvy, nejedná se přímo o barevné tóny dle ral (neplatí pro rolety objednané v barvě ral). poškození rolety vzniklé silou větru a to i v případě použití větrného čidla."}, {"k": "Venkovní rolety", "p": "Roleta do překladu HELUZ", "sl": "do-prekladu-heluz", "d": "Vyměřovací a montá m ze strany uživatele (včetně poškození vzniklých umístěním  překážky pod lamely, poškození vlivem námrazy na lamelách apod.). závady způsobené chybnou montáží nebo obsluhou, popř. montáží do nevhodného prostředí. závady způsobené překročením mezních rozměrů jednotlivých výrobků dle čsn en 13659+a1 (mezní rozměry  jednotlivých typů výrobků - max. šířka, výška, plocha, hmotnost). závady, na které byl kupující předem upozorněn (zvláště pak závady vzniklé z důvodu atypického provedení). odchylky v typu a množství zboží způsobené chybnou objednávkou. odlišné odstíny lamel, profilů a jiných komponentů u zakázek (obj. zboží), které jsou vyráběny na dvě nebo více částí (nebo ve dvou či více termínech). vizuální vady se posuzují kolmo k povrchu ze vzdálenosti 1 m, za běžného světla. špatné dovírání lamel vlivem nečistot v zámcích lamel. špatně zvolený motor nebo příslušenství, které není určeno pro daný druh výrobku. otisky závěsů pancíře nepředstavují vadu výrobku. odlišné odstíny kresby a barevnosti u imitací dřeva. při venkovních teplotách pod 0 °c je důležité nevytahovat roletu až nahoru, ale nechat ji z boxu částečně vysunutou a to cca 10 cm, jinak může dojít k zajetí koncové lamely do boxu a poškození rolety. chybné funkce vlivem teplotních výkyvů, způsobené fyzikálními jevy, které výrobce nemůže ovlivnit. kondenzace vlhkosti na pásce, šňůře nebo klice za chladného počasí. venkovní rolety v případě reklamace motoru je nutné vrátit motor s přívodním kabelem v délce min. 10 cm. rolety neslouží k úplnému zatemnění, tato skutečnost není předmětem reklamace (vodícími lištami, v prosvětlovacích otvorech u lamel a v oblasti schránky může prostupovat světlo). integrovaná síť proti hmyzu není 100% ochranou proti vniknutí hmyzu. prohnutí plastové koncovky vl vlivem váhy pancíře, pokud není koncovka podepřená v celé své šířce. lamely v horní části pancíře na sebe nemusí zcela dosedat, tato skutečnost není považována za závadu výrobku. odstín barvy hliníkových komponentů se může ání lamel vlivem nečistot v zámcích lamel. špatně zvolený motor nebo příslušenství, které není určeno pro daný druh výrobku. otisky závěsů pancíře nepředstavují vadu výrobku. odlišné odstíny kresby a barevnosti u imitací dřeva. při venkovních teplotách pod 0 °c je důležité nevytahovat roletu až nahoru, ale nechat ji z boxu částečně vysunutou a to cca 10 cm, jinak může dojít k zajetí koncové lamely do boxu a poškození rolety. chybné funkce vlivem teplotních výkyvů, způsobené fyzikálními jevy, které výrobce nemůže ovlivnit. kondenzace vlhkosti na pásce, šňůře nebo klice za chladného počasí. venkovní rolety v případě reklamace motoru je nutné vrátit motor s přívodním kabelem v délce min. 10 cm. rolety neslouží k úplnému zatemnění, tato skutečnost není předmětem reklamace (vodícími lištami, v prosvětlovacích otvorech u lamel a v oblasti schránky může prostupovat světlo). integrovaná síť proti hmyzu není 100% ochranou proti vniknutí hmyzu. prohnutí plastové koncovky vl vlivem váhy pancíře, pokud není koncovka podepřená v celé své šířce. lamely v horní části pancíře na sebe nemusí zcela dosedat, tato skutečnost není považována za závadu výrobku. odstín barvy hliníkových komponentů se může mírně lišit podle technologie výroby komponentu (válcovaný, extrudovaný, odlitek). uvedené číslo ral vyjadřuje nejbližší odstín barvy, nejedná se přímo o barevné tóny dle ral (neplatí pro rolety objednané v barvě ral). poškození rolety vzniklé silou větru a to i v případě použití větrného čidla."}, {"k": "Venkovní rolety", "p": "Venkovní roleta RF KOMBI PA43", "sl": "rf-kombi-pa43", "d": "Barevné varianty lamel PA43, vodících lišt a koncových lamel (pdf)", "df": "barevne-varianty.pdf", "n": "Lamela PA43 – barevné varianty", "h1": null, "h2": "Lamela PA43 – barevné varianty", "kr": null, "v": null, "i": "rf-kombi-pa43/barevne-varianty__s01.png", "t": "lamela pa43 – barevné varianty skladem na objednávku na objednávku za příplatek kód barva ral kód barva ral kód barva ral stříbrná šedá tma ační podmínky - venkovní rolety (pdf)", "df": "reklamace-venkovni-rolety.pdf", "n": "Neoprávněné reklamace", "h1": "Neoprávněné reklamace", "h2": null, "kr": null, "v": null, "i": "rf-mono-pa39/reklamace-venkovni-rolety__s02.png", "t": "neoprávněné reklamace závady zboží způsobené jiným používáním výrobku, než ke kterému je výrobek určen. závady způsobené mechanickým poškozením ze strany uživatele (včetně poškození vzniklých umístěním  překážky pod lamely, poškození vlivem námrazy na lamelách apod.). závady způsobené chybnou montáží nebo obsluhou, popř. montáží do nevhodného prostředí. závady způsobené překročením mezních rozměrů jednotlivých výrobků dle čsn en 13659+a1 (mezní rozměry  jednotlivých typů výrobků - max. šířka, výška, plocha, hmotnost). závady, na které byl kupující předem upozorněn (zvláště pak závady vzniklé z důvodu atypického provedení). odchylky v typu a množství zboží způsobené chybnou objednávkou. odlišné odstíny lamel, profilů a jiných komponentů u zakázek (obj. zboží), které jsou vyráběny na dvě nebo více částí (nebo ve dvou či více termínech). vizuální vady se posuzují kolmo k povrchu ze vzdálenosti 1 m, za běžného světla. špatné dovírání lamel vlivem nečistot v zámcích lamel. špatně zvolený motor nebo příslušenství, které není určeno pro daný druh výrobku. otisky závěsů pancíře nepředstavují vadu výrobku. odlišné odstíny kresby a barevnosti u imitací dřeva. při venkovních teplotách pod 0 °c je důležité nevytahovat roletu až nahoru, ale nechat ji z boxu částečně vysunutou a to cca 10 cm, jinak může dojít k zajetí koncové lamely do boxu a poškození rolety. chybné funkce vlivem teplotních výkyvů, způsobené fyzikálními jevy, které výrobce nemůže ovlivnit. kondenzace vlhkosti na pásce, šňůře nebo klice za chladného počasí. venkovní rolety v případě reklamace motoru je nutné vrátit motor s přívodním kabelem v délce min. 10 cm. rolety neslouží k úplnému zatemnění, tato skutečnost není předmětem reklamace (vodícími lištami, v prosvětlovacích otvorech u lamel a v oblasti schránky může prostupovat světlo). integrovaná síť proti hmyzu není 100% ochranou proti vniknutí hmyzu. prohnutí plastové koncovky vl vlivem váhy pancíře, pokud není koncovka podepřená v celé své šířce. lamely v horní části pancíře na sebe nemusí zcela dosedat, tato skutečnost není považována za závadu výrobku. odstín barvy hliníkových komponentů se může mírně lišit podle technologie výroby komponentu (válcovaný, extrudovaný, odlitek). uvedené číslo ral vyjadřuje nejbližší odstín barvy, nejedná se přímo o barevné tóny dle ral (neplatí pro rolety objednané v barvě ral). poškození rolety vzniklé silou větru a to i v případě použití větrného čidla."}, {"k": "Venkovní rolety", "p": "Venkovní roleta RF MONO PA39", "sl": "rf-mono-pa39", "d": "Barevné varianty lamel PA39, vodících lišt a koncových lamel (pdf)", "df": "barevne-varianty.pdf", "n": "Lamela PA39 – barevné varianty", "h1": null, "h2": "Lamela PA39 – barevné varianty", "kr": null, "v": null, "i": "rf-mono-pa39/barevne-varianty__s01.png", "t": "lamela pa39 – barevné varianty skladem na objednávku na objednávku za příplatek kód barva ral kód barva ral kód barva ral stříbrná tmavě béžová žlutá bílá tmavé dřevo červená šedá světlé dřevo zelená béžová krémově bílá jedlová zeleň tmavě hnědá slonová kost ocelově modrá hnědá černá bordó antracitově šedá ultra bílá bazaltově šedá mahagon zlatý dub křemenná šedá ořech světle šedá betonově šedá wenge šedý hliník zlatý dub ledově šedá perlově bílá satinově šedá perlově antracitově šedá winchester metalická šedá světlý dub"}, {"k": "Venkovní rolety", "p": "Venkovní roleta RF MONO PA39", "sl": "rf-mono-pa39", "d": "Barevné varianty lamel PA39, vodících lišt a koncových lamel (pdf)", "df": "barevne-varianty.pdf", "n": "Vodící lišty pro lamelu PA39 – barevné varianty", "h1": null, "h2": "Vodící lišty pro lamelu PA39 – barevné varianty", "kr": null, "v": null, "i": "rf-mono-pa39/barevne-varianty__s02.png", "t": "vodící lišty pro lamelu pa39 – barevné varian , plocha, hmotnost). závady, na které byl kupující předem upozorněn (zvláště pak závady vzniklé z důvodu atypického provedení). odchylky v typu a množství zboží způsobené chybnou objednávkou. odlišné odstíny lamel, profilů a jiných komponentů u zakázek (obj. zboží), které jsou vyráběny na dvě nebo více částí (nebo ve dvou či více termínech). vizuální vady se posuzují kolmo k povrchu ze vzdálenosti 1 m, za běžného světla. špatné dovírání lamel vlivem nečistot v zámcích lamel. špatně zvolený motor nebo příslušenství, které není určeno pro daný druh výrobku. otisky závěsů pancíře nepředstavují vadu výrobku. odlišné odstíny kresby a barevnosti u imitací dřeva. při venkovních teplotách pod 0 °c je důležité nevytahovat roletu až nahoru, ale nechat ji z boxu částečně vysunutou a to cca 10 cm, jinak může dojít k zajetí koncové lamely do boxu a poškození rolety. chybné funkce vlivem teplotních výkyvů, způsobené fyzikálními jevy, které výrobce nemůže ovlivnit. kondenzace vlhkosti na pásce, šňůře nebo klice za chladného počasí. venkovní rolety v případě reklamace motoru je nutné vrátit motor s přívodním kabelem v délce min. 10 cm. rolety neslouží k úplnému zatemnění, tato skutečnost není předmětem reklamace (vodícími lištami, v prosvětlovacích otvorech u lamel a v oblasti schránky může prostupovat světlo). integrovaná síť proti hmyzu není 100% ochranou proti vniknutí hmyzu. prohnutí plastové koncovky vl vlivem váhy pancíře, pokud není koncovka podepřená v celé své šířce. lamely v horní části pancíře na sebe nemusí zcela dosedat, tato skutečnost není považována za závadu výrobku. odstín barvy hliníkových komponentů se může mírně lišit podle technologie výroby komponentu (válcovaný, extrudovaný, odlitek). uvedené číslo ral vyjadřuje nejbližší odstín barvy, nejedná se přímo o barevné tóny dle ral (neplatí pro rolety objednané v barvě ral). poškození rolety vzniklé silou větru a to i v případě použití větrného čidla."}, {"k": "Venkovní rolety", "p": "Venkovní roleta RF MONO PA43", Lamela PA39 – maximální výška rolety včetně boxu (mm)", "kr": null, "v": null, "i": "rk-kombi-pa39/lamela-pa-39-max-vyska-sirka__s02.png", "t": "lamela pa39 – maximální výška rolety včetně boxu (mm) sw40 sw40 + pz/45 sw50 sw50 + pz/56 sw60 sw60 + pz68 sk/skp/150 sk/skp/165 sk/skp/180 sk/skp/205"}, {"k": "Venkovní rolety", "p": "Venkovní roleta RK KOMBI PA39", "sl": "rk-kombi-pa39", "d": "Reklamační podmínky - venkovní rolety (pdf)", "df": "reklamace-venkovni-rolety.pdf", "n": "Oprávněné reklamace", "h1": "Oprávněné reklamace", "h2": null, "kr": null, "v": null, "i": "rk-kombi-pa39/reklamace-venkovni-rolety__s01.png", "t": "oprávněné reklamace jack west poškozené (poškrábané, odřené) zboží. rozměry rolet mimo toleranci oproti zadanému výrobnímu rozměru."}, {"k": "Venkovní rolety", "p": "Venkovní roleta RK KOMBI PA39", "sl": "rk-kombi-pa39", "d": "Reklamační podmínky - venkovní rolety (pdf)", "df": "reklamace-venkovni-rolety.pdf", "n": "Neoprávněné reklamace", "h1": "Neoprávněné reklamace", "h2": null, "kr": null, "v": null, "i": "rk-kombi-pa39/reklamace-venkovni-rolety__s02.png", "t": "neoprávněné reklamace závady zboží způsobené jiným používáním výrobku, než ke kterému je výrobek určen. závady způsobené mechanickým poškozením ze strany uživatele (včetně poškození vzniklých umístěním  překážky pod lamely, poškození vlivem námrazy na lamelách apod.). závady způsobené chybnou montáží nebo obsluhou, popř. montáží do nevhodného prostředí. závady způsobené překročením mezních rozměrů jednotlivých výrobků dle čsn en 13659+a1 (mezní rozměry  jednotlivých typů výrobků - max. šířka, výška, plocha, hmotnost). závady, na které byl kupující předem upozorněn (zvláště pak závady vzniklé z důvodu atypického provedení). odchylky v typu a množství zboží způsobené chybnou objednávkou. odlišné odstíny lamel, profilů a jiných komponentů u zakázek (obj. zboží), které jsou vyráběny na dvě nebo více částí (nebo ve dvou či více termínech). vizuální vady se posuzují kolmo k povrchu ze vzdálenosti 1 m, za běžného světla. špatné dovírání lamel vlivem nečistot v zámcích lamel. špatně zvolený motor nebo příslušenství, které není určeno pro daný druh výrobku. otisky závěsů pancíře nepředstavují vadu výrobku. odlišné odstíny kresby a barevnosti u imitací dřeva. při venkovních teplotách pod 0 °c je důležité nevytahovat roletu až nahoru, ale nechat ji z boxu částečně vysunutou a to cca 10 cm, jinak může dojít k zajetí koncové lamely do boxu a poškození rolety. chybné funkce vlivem teplotních výkyvů, způsobené fyzikálními jevy, které výrobce nemůže ovlivnit. kondenzace vlhkosti na pásce, šňůře nebo klice za chladného počasí. venkovní rolety v případě reklamace motoru je nutné vrátit motor s přívodním kabelem v délce min. 10 cm. rolety neslouží k úplnému zatemnění, tato skutečnost není předmětem reklamace (vodícími lištami, v prosvětlovacích otvorech u lamel a v oblasti schránky může prostupovat světlo). integrovaná síť proti hmyzu není 100% ochranou proti vniknutí hmyzu. prohnutí plastové koncovky vl vlivem váhy pancíře, pokud není koncovka podepřená v celé své šířce. lamely v horní části pancíře na sebe nemusí zcela dosedat, tato skutečnost není považována za závadu výrobku. odstín barvy hliníkových komponentů se může mírně lišit podle technologie výroby komponentu (válcovaný, extrudovaný, odlitek). uvedené číslo ral vyjadřuje nejbližší odstín barvy, nejedná se přímo o barevné tóny dle ral (neplatí pro rolety objednané v barvě ral). poškození rolety vzniklé silou větru a to i v případě použití větrného čidla."}, {"k": "Venkovní rolety", "p": "Venkovní roleta RK KOMBI PA39", "sl": "rk-kombi-pa39", "d": "Barevné varianty boxu (pdf)", "df": "barevne-varianty-boxu.pdf", "n": "Barevné varianty boxu SK 45° pro velikost 150", "h1": null, "h2": "Barevné varianty boxu SK 45° pro velikost 150", "kr": null, "v": null, "i": "rk-kombi-pa39/barevne-varianty-boxu__s01.png", "t": "barevné varianty boxu sk 45° pro velikost 150 skladem na objednávku kód barva ral kód barva ral ng", "t": "oprávněné reklamace jack west poškozené (poškrábané, odřené) zboží. rozměry rolet mimo toleranci oproti zadanému výrobnímu rozměru."}, {"k": "Venkovní rolety", "p": "Venkovní roleta RK KOMBI PA43", "sl": "rk-kombi-pa43", "d": "Reklamační podmínky - venkovní rolety (pdf)", "df": "reklamace-venkovni-rolety.pdf", "n": "Neoprávněné reklamace", "h1": "Neoprávněné reklamace", "h2": null, "kr": null, "v": null, "i": "rk-kombi-pa43/reklamace-venkovni-rolety__s02.png", "t": "neoprávněné reklamace závady zboží způsobené jiným používáním výrobku, než ke kterému je výrobek určen. závady způsobené mechanickým poškozením ze strany uživatele (včetně poškození vzniklých umístěním  překážky pod lamely, poškození vlivem námrazy na lamelách apod.). závady způsobené chybnou montáží nebo obsluhou, popř. montáží do nevhodného prostředí. závady způsobené překročením mezních rozměrů jednotlivých výrobků dle čsn en 13659+a1 (mezní rozměry  jednotlivých typů výrobků - max. šířka, výška, plocha, hmotnost). závady, na které byl kupující předem upozorněn (zvláště pak závady vzniklé z důvodu atypického provedení). odchylky v typu a množství zboží způsobené chybnou objednávkou. odlišné odstíny lamel, profilů a jiných komponentů u zakázek (obj. zboží), které jsou vyráběny na dvě nebo více částí (nebo ve dvou či více termínech). vizuální vady se posuzují kolmo k povrchu ze vzdálenosti 1 m, za běžného světla. špatné dovírání lamel vlivem nečistot v zámcích lamel. špatně zvolený motor nebo příslušenství, které není určeno pro daný druh výrobku. otisky závěsů pancíře nepředstavují vadu výrobku. odlišné odstíny kresby a barevnosti u imitací dřeva. při venkovních teplotách pod 0 °c je důležité nevytahovat roletu až nahoru, ale nechat ji z boxu částečně vysunutou a to cca 10 cm, jinak může dojít k zajetí koncové lamely do boxu a poškození rolety. chybné funkce vlivem teplotních výkyvů, způsobené fyzikálními jevy, které výrobce nemůže ovlivnit. kondenzace vlhkosti na pásce, šňůře nebo klice za chladného počasí. venkovní rolety v případě reklamace motoru je nutné vrátit motor s přívodním kabelem v délce min. 10 cm. rolety neslouží k úplnému zatemnění, tato skutečnost není předmětem reklamace (vodícími lištami, v prosvětlovacích otvorech u lamel a v oblasti schránky může prostupovat světlo). integrovaná síť proti hmyzu není 100% ochranou proti vniknutí hmyzu. prohnutí plastové koncovky vl vlivem váhy pancíře, pokud není koncovka podepřená v celé své šířce. lamely v horní části pancíře na sebe nemusí zcela dosedat, tato skutečnost není považována za závadu výrobku. odstín barvy hliníkových komponentů se může mírně lišit podle technologie výroby komponentu (válcovaný, extrudovaný, odlitek). uvedené číslo ral vyjadřuje nejbližší odstín barvy, nejedná se přímo o barevné tóny dle ral (neplatí pro rolety objednané v barvě ral). poškození rolety vzniklé silou větru a to i v případě použití větrného čidla."}, {"k": "Venkovní rolety", "p": "Venkovní roleta RK KOMBI PA43", "sl": "rk-kombi-pa43", "d": "Způsoby montáže (pdf)", "df": "zpusoby-montaze.pdf", "n": "Způsoby montáže", "h1": null, "h2": "Způsoby montáže", "kr": null, "v": "A", "i": "rk-kombi-pa43/zpusoby-montaze__s01.png", "t": "způsoby montáže roleta namontovaná na stěně budovy. roleta navíjená směrem ven (levotočivá)"}, {"k": "Venkovní rolety", "p": "Venkovní roleta RK KOMBI PA43", "sl": "rk-kombi-pa43", "d": "Způsoby montáže (pdf)", "df": "zpusoby-montaze.pdf", "n": "Způsoby montáže", "h1": null, "h2": "Způsoby montáže", "kr": null, "v": "B", "i": "rk-kombi-pa43/zpusoby-montaze__s02.png", "t": "způsoby montáže roleta namontovaná v okenním otvoru. roleta navíjená směrem ven (levotočivá)"}, {"k": "Venkovní rolety", "p": "Venkovní roleta RK KOMBI PA43", "sl": "rk-kombi-pa43", "d": "Barevné varianty boxu (pdf)", "df": "barevne-varianty-boxu.pdf", "n": "Barevné varianty boxu SK 45° pro velikost 150", "h1": null, "h2": "Barevné varianty boxu SK 45° pro velikost 150", "kr": null, "v": null, "i": "rk-kombi-pa43/ba  špatné dovírání lamel vlivem nečistot v zámcích lamel. špatně zvolený motor nebo příslušenství, které není určeno pro daný druh výrobku. otisky závěsů pancíře nepředstavují vadu výrobku. odlišné odstíny kresby a barevnosti u imitací dřeva. při venkovních teplotách pod 0 °c je důležité nevytahovat roletu až nahoru, ale nechat ji z boxu částečně vysunutou a to cca 10 cm, jinak může dojít k zajetí koncové lamely do boxu a poškození rolety. chybné funkce vlivem teplotních výkyvů, způsobené fyzikálními jevy, které výrobce nemůže ovlivnit. kondenzace vlhkosti na pásce, šňůře nebo klice za chladného počasí. venkovní rolety v případě reklamace motoru je nutné vrátit motor s přívodním kabelem v délce min. 10 cm. rolety neslouží k úplnému zatemnění, tato skutečnost není předmětem reklamace (vodícími lištami, v prosvětlovacích otvorech u lamel a v oblasti schránky může prostupovat světlo). integrovaná síť proti hmyzu není 100% ochranou proti vniknutí hmyzu. prohnutí plastové koncovky vl vlivem váhy pancíře, pokud není koncovka podepřená v celé své šířce. lamely v horní části pancíře na sebe nemusí zcela dosedat, tato skutečnost není považována za závadu výrobku. odstín barvy hliníkových komponentů se může mírně lišit podle technologie výroby komponentu (válcovaný, extrudovaný, odlitek). uvedené číslo ral vyjadřuje nejbližší odstín barvy, nejedná se přímo o barevné tóny dle ral (neplatí pro rolety objednané v barvě ral). poškození rolety vzniklé silou větru a to i v případě použití větrného čidla."}, {"k": "Venkovní rolety", "p": "Venkovní roleta RK MONO PA39", "sl": "rk-mono-pa39", "d": "Barevné varianty lamel PA39, vodících lišt a koncových lamel (pdf)", "df": "barevne-varianty.pdf", "n": "Lamela PA39 – barevné varianty", "h1": null, "h2": "Lamela PA39 – barevné varianty", "kr": null, "v": null, "i": "rk-mono-pa39/barevne-varianty__s01.png", "t": "lamela pa39 – barevné varianty skladem na objednávku na objednávku za příplatek kód barva ral kód barva ral kód barva ral stříbrn ovní roleta RK MONO PA43", "sl": "rk-mono-pa43", "d": "Lamela PA43 - max. šířka a výška (pdf)", "df": "lamela-pa-43-max-vyska-sirka.pdf", "n": "Lamela PA43 – maximální šířka rolety (mm)", "h1": null, "h2": "Lamela PA43 – maximální šířka rolety (mm)", "kr": null, "v": null, "i": "rk-mono-pa43/lamela-pa-43-max-vyska-sirka__s01.png", "t": "lamela pa43 – maximální šířka rolety (mm) pp53, pp53/ods, ppd79, pk53 ppmo53, pp53/ods/20, d/pp, pk53/120, třídění odolnosti a zatížení větrem pp45 pp68 ppd79/ods, ppd79/ods/20, ppdmo79 < 2900 < 3300 < 3900 < 2600 < 3000 < 3400 < 2400 < 2600 < 3000 < 2000 < 2200 < 2400 < 1700 < 1900 < 2100 < 1500 < 1600 < 1800"}, {"k": "Venkovní rolety", "p": "Venkovní roleta RK MONO PA43", "sl": "rk-mono-pa43", "d": "Lamela PA43 - max. šířka a výška (pdf)", "df": "lamela-pa-43-max-vyska-sirka.pdf", "n": "Lamela PA43 – maximální výška rolety včetně boxu (mm)", "h1": null, "h2": "Lamela PA43 – maximální výška rolety včetně boxu (mm)", "kr": null, "v": null, "i": "rk-mono-pa43/lamela-pa-43-max-vyska-sirka__s02.png", "t": "lamela pa43 – maximální výška rolety včetně boxu (mm) sw 40* sw 40 + pz/45 sw50* sw50 + pz/56 sw 60* sw 60 + pz/68 sk/skp/137 sk/skp/150 sk/skp/165 sk/skp/180 sk/skp/205 * hřídel bez rozšiřovacích kroužků nebo při použití bezpečnostních závěsů simu – easylink"}, {"k": "Venkovní rolety", "p": "Venkovní roleta RK MONO PA43", "sl": "rk-mono-pa43", "d": "Reklamační podmínky - venkovní rolety (pdf)", "df": "reklamace-venkovni-rolety.pdf", "n": "Oprávněné reklamace", "h1": "Oprávněné reklamace", "h2": null, "kr": null, "v": null, "i": "rk-mono-pa43/reklamace-venkovni-rolety__s01.png", "t": "oprávněné reklamace jack west poškozené (poškrábané, odřené) zboží. rozměry rolet mimo toleranci oproti zadanému výrobnímu rozměru."}, {"k": "Venkovní rolety", "p": "Venkovní roleta RK MONO PA43", "sl": "rk-mono-pa43", "d": "Reklamační podmínky - venkovní rolety (pdf)", "df": "reklamace-venkovni-rolety.pdf", "n": "Neoprávněné reklamace", "h1": "Neoprávněné reklamace", "h2": null, "kr": null, "v": null, "i": "rk-mono-pa43/reklamace-venkovni-rolety__s02.png", "t": "neoprávněné reklamace závady zboží způsobené jiným používáním výrobku, než ke kterému je výrobek určen. závady způsobené mechanickým poškozením ze strany uživatele (včetně poškození vzniklých umístěním  překážky pod lamely, poškození vlivem námrazy na lamelách apod.). závady způsobené chybnou montáží nebo obsluhou, popř. montáží do nevhodného prostředí. závady způsobené překročením mezních rozměrů jednotlivých výrobků dle čsn en 13659+a1 (mezní rozměry  jednotlivých typů výrobků - max. šířka, výška, plocha, hmotnost). závady, na které byl kupující předem upozorněn (zvláště pak závady vzniklé z důvodu atypického provedení). odchylky v typu a množství zboží způsobené chybnou objednávkou. odlišné odstíny lamel, profilů a jiných komponentů u zakázek (obj. zboží), které jsou vyráběny na dvě nebo více částí (nebo ve dvou či více termínech). vizuální vady se posuzují kolmo k povrchu ze vzdálenosti 1 m, za běžného světla. špatné dovírání lamel vlivem nečistot v zámcích lamel. špatně zvolený motor nebo příslušenství, které není určeno pro daný druh výrobku. otisky závěsů pancíře nepředstavují vadu výrobku. odlišné odstíny kresby a barevnosti u imitací dřeva. při venkovních teplotách pod 0 °c je důležité nevytahovat roletu až nahoru, ale nechat ji z boxu částečně vysunutou a to cca 10 cm, jinak může dojít k zajetí koncové lamely do boxu a poškození rolety. chybné funkce vlivem teplotních výkyvů, způsobené fyzikálními jevy, které výrobce nemůže ovlivnit. kondenzace vlhkosti na pásce, šňůře nebo klice za chladného počasí. venkovní rolety v případě reklamace motoru je nutné vrátit motor s přívodním kabelem v délce min. 10 cm. rolety neslouží k úplnému zatemnění, tato skutečnost není předmětem reklamace (vodícími lištami, v prosvětlovacích otvorech u lamel a v oblasti schránky může prostupovat světlo). integrovaná síť proti hmyzu není 100% ochranou proti vniknutí hmyzu. e-venkovni-rolety__s01.png", "t": "oprávněné reklamace jack west poškozené (poškrábané, odřené) zboží. rozměry rolet mimo toleranci oproti zadanému výrobnímu rozměru."}, {"k": "Venkovní rolety", "p": "Venkovní roleta RK MONO PA52", "sl": "rk-mono-pa52", "d": "Reklamační podmínky - venkovní rolety (pdf)", "df": "reklamace-venkovni-rolety.pdf", "n": "Neoprávněné reklamace", "h1": "Neoprávněné reklamace", "h2": null, "kr": null, "v": null, "i": "rk-mono-pa52/reklamace-venkovni-rolety__s02.png", "t": "neoprávněné reklamace závady zboží způsobené jiným používáním výrobku, než ke kterému je výrobek určen. závady způsobené mechanickým poškozením ze strany uživatele (včetně poškození vzniklých umístěním  překážky pod lamely, poškození vlivem námrazy na lamelách apod.). závady způsobené chybnou montáží nebo obsluhou, popř. montáží do nevhodného prostředí. závady způsobené překročením mezních rozměrů jednotlivých výrobků dle čsn en 13659+a1 (mezní rozměry  jednotlivých typů výrobků - max. šířka, výška, plocha, hmotnost). závady, na které byl kupující předem upozorněn (zvláště pak závady vzniklé z důvodu atypického provedení). odchylky v typu a množství zboží způsobené chybnou objednávkou. odlišné odstíny lamel, profilů a jiných komponentů u zakázek (obj. zboží), které jsou vyráběny na dvě nebo více částí (nebo ve dvou či více termínech). vizuální vady se posuzují kolmo k povrchu ze vzdálenosti 1 m, za běžného světla. špatné dovírání lamel vlivem nečistot v zámcích lamel. špatně zvolený motor nebo příslušenství, které není určeno pro daný druh výrobku. otisky závěsů pancíře nepředstavují vadu výrobku. odlišné odstíny kresby a barevnosti u imitací dřeva. při venkovních teplotách pod 0 °c je důležité nevytahovat roletu až nahoru, ale nechat ji z boxu částečně vysunutou a to cca 10 cm, jinak může dojít k zajetí koncové lamely do boxu a poškození rolety. chybné funkce vlivem teplotních výkyvů, způsobené fyzikálními jevy, které výrobce nemůže ovlivnit. kondenzace vlhkosti na pásce, const m=document.getElementById('m'),q=document.getElementById('q'),
      kat=document.getElementById('kat'),prod=document.getElementById('prod'),stat=document.getElementById('stat'),lb=document.getElementById('lb');
function napln(sel,vals,label){sel.innerHTML='<option value="">'+label+'</option>'+[...new Set(vals)].sort().map(v=>`<option>${v}</option>`).join('')}
napln(kat,D.map(d=>d.k),'— všechny kategorie —');
function obnovProd(){napln(prod,D.filter(d=>!kat.value||d.k===kat.value).map(d=>d.p),'— všechny produkty —')}
obnovProd();
function render(){
  const s=q.value.trim().toLowerCase();
  const f=D.filter(d=>(!kat.value||d.k===kat.value)&&(!prod.value||d.p===prod.value)&&(!s||d.t.includes(s)||d.p.toLowerCase().includes(s)));
  stat.textContent=`${f.length} z ${D.length} sekcí`;
  m.innerHTML=f.map(d=>`<figure><img loading="lazy" src="${d.i}" alt="">
    <figcaption><div class="nad">${d.n||'—'}${d.v?`<span class="var">${d.v}</span>`:''}</div>
    <div class="meta">${d.p} · ${d.d}</div></figcaption></figure>`).join('');
  m.querySelectorAll('img').forEach((im,i)=>im.onclick=()=>{
    lb.querySelector('img').src=f[i].i; lb.querySelector('p').textContent=`${f[i].p} · ${f[i].d} · ${f[i].n||''}`; lb.showModal();});
}
q.oninput=render; kat.onchange=()=>{obnovProd();render()}; prod.onchange=render;
lb.onclick=()=>lb.close(); render();
</script></body></html>
